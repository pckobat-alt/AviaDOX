<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AviaDoX</title>
<meta name="theme-color" content="#0b3d91">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="AviaDoX">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="i18n.js"></script>
<script src="/_aistudio-iframe.js?v=29045eb3"></script></head>
<body>
<!-- Açılış animasyonlu GIF logo ekranı (kendi GIF'inizi kullanmak için splash.gif dosyasını değiştirin) -->
<div id="splash" role="status" aria-label="AviaDoX yükleniyor">
  <img src="splash.gif" alt="AviaDoX" class="splash-gif" width="132" height="143">
  <div class="wm splash-wm"><span>Avia</span><b>DoX</b></div>
  <div class="mu splash-sub">Balon operasyonları · Çevrimdışı uyumlu</div>
</div>

<div id="app"><p class="ld">Yükleniyor…</p></div>

<!-- Önce yerel paketli Supabase SDK (internetsiz APK/IPA açılışı için); native veya çevrimdışı ortamda dış CDN çağrısı yapılmaz -->
<script src="vendor/supabase.umd.js"></script>
<script>
(function () {
  var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
  if (typeof window.supabase === "undefined" && !isNative && navigator.onLine) {
    var s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js";
    s.async = true;
    document.head.appendChild(s);
  }
})();
</script>
<script src="config.js"></script>
<script src="notifications.js"></script>
<script src="privacy.js"></script>
<script src="app.js"></script>
<script src="flightlog.js"></script>
<script src="weather.js"></script>
<script src="slot.js"></script>
<script>
(function () {
  var booted = false;
  function startApp() {
    if (booted) return;
    booted = true;
    try {
      if (typeof initApp === "function") initApp();
    } catch (e) {
      console.error("initApp error:", e);
      var sp = document.getElementById("splash");
      if (sp) sp.remove();
    }
    var isNative = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());
    if (!isNative && "serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    }
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", startApp);
  } else {
    startApp();
  }
  // Güvenlik koruması: iOS/Android WebView çevrimdışı açılışta splash asla takılı kalmasın
  setTimeout(function () {
    var sp = document.getElementById("splash");
    if (sp && sp.parentNode) {
      sp.classList.add("hide");
      setTimeout(function () { if (sp.parentNode) sp.remove(); }, 500);
    }
  }, 3000);
})();
</script>
</body>
</html>
