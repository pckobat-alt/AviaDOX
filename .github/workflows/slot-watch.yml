# ==============================================================================
# AviaDoX — Kapadokya Slot Merkezi Dinamik Kontrol İş Akışı (Sunucu Tarafı)
#
# Kural:
#   • Kapadokya (Göreme/Nevşehir 38.6431°K, 34.8289°D, UTC+3) gün doğumundan
#     45 dakika önce başlar.
#   • GitHub Actions en sık 5 dk cron desteklediğinden her tetiklemede 2 dk
#     arayla 2 tur tarama yaparak ~2 dk aralıkla güncel kalır.
#   • Saat 08:00 (TR) sonrası Supabase'deki tüm bölgeler Uçulmaz (red/yellow)
#     durumuna geçtiğinde otomatik kontrolü durdurur.
#
# Kurulum:
#   Bu dosyayı deponuzdaki .github/workflows/slot-watch.yml olarak kaydedin.
#   Gerekli Secrets: SUPABASE_URL, SUPABASE_SERVICE_KEY, VAPID_PUBLIC,
#                    VAPID_PRIVATE, VAPID_SUBJECT
# ==============================================================================
name: AviaDoX Slot Watch (Dinamik Gün Doğumu)

on:
  workflow_dispatch:
  schedule:
    # UTC 01:00 - 11:55 arası her 5 dakikada bir (= TR 04:00 - 14:55 arası)
    - cron: "*/5 1-11 * * *"

concurrency:
  group: slot-watch
  cancel-in-progress: false

jobs:
  watch-slot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Kapadokya gün doğumu ve 08:00+ Uçulmaz penceresini kontrol et
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          node - <<'EOF'
          const fs = require("fs");
          const CAP_LAT = 38.6431, CAP_LON = 34.8289, TR_TZ_MIN = 180;
          const rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
          function sunriseMin(y, mo, day) {
            const jd = Date.UTC(y, mo, day) / 86400000 + 2440587.5;
            const T = (jd - 2451545.0) / 36525.0;
            const L0 = (280.46646 + T * (36000.76983 + T * 0.0003032)) % 360;
            const M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
            const e = 0.016708634 - T * (0.000042037 + 0.0000001267 * T);
            const Mr = rad(M), L0r = rad(L0);
            const C = Math.sin(Mr) * (1.914602 - T * (0.004817 + 0.000014 * T))
              + Math.sin(2 * Mr) * (0.019993 - 0.000101 * T)
              + Math.sin(3 * Mr) * 0.000289;
            const omega = 125.04 - 1934.136 * T;
            const lambda = L0 + C - 0.00569 - 0.00478 * Math.sin(rad(omega));
            const eps0 = 23 + (26 + ((21.448 - T * (46.815 + T * (0.00059 - T * 0.001813))) / 60)) / 60;
            const eps = eps0 + 0.00256 * Math.cos(rad(omega));
            const decl = Math.asin(Math.sin(rad(eps)) * Math.sin(rad(lambda)));
            const varY = Math.tan(rad(eps) / 2) ** 2;
            const eqTime = 4 * deg(varY * Math.sin(2 * L0r) - 2 * e * Math.sin(Mr) + 4 * e * varY * Math.sin(Mr) * Math.cos(2 * L0r) - 0.5 * varY * varY * Math.sin(4 * L0r) - 1.25 * e * e * Math.sin(2 * Mr));
            const cosHA = (Math.cos(rad(90.833)) / (Math.cos(rad(CAP_LAT)) * Math.cos(decl))) - Math.tan(rad(CAP_LAT)) * Math.tan(decl);
            const ha = deg(Math.acos(Math.max(-1, Math.min(1, cosHA))));
            return (720 - 4 * CAP_LON - eqTime + TR_TZ_MIN) - 4 * ha;
          }
          const fmt = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(Math.round(m) % 60).padStart(2, "0")}`;

          (async () => {
            const out = process.env.GITHUB_OUTPUT;
            if (process.env.FORCE_RUN === "1") {
              console.log("Elle tetiklendi (workflow_dispatch) -> çalışıyor.");
              fs.appendFileSync(out, "run=true\nsecond_pass=false\n");
              return;
            }
            const tr = new Date(Date.now() + TR_TZ_MIN * 60000);
            const trMin = tr.getUTCHours() * 60 + tr.getUTCMinutes() + tr.getUTCSeconds() / 60;
            const sr = sunriseMin(tr.getUTCFullYear(), tr.getUTCMonth(), tr.getUTCDate());
            const startMin = sr - 45;
            console.log(`TR saat: ${fmt(trMin)} | Gün doğumu: ${fmt(sr)} | Başlangıç: ${fmt(startMin)}`);

            if (trMin < startMin) {
              console.log("Gün doğumundan 45 dk öncesinden erken -> atlandı.");
              fs.appendFileSync(out, "run=false\nsecond_pass=false\n");
              return;
            }

            if (trMin >= 480 && process.env.SUPABASE_URL && process.env.SUPABASE_SERVICE_KEY) {
              try {
                const res = await fetch(`${process.env.SUPABASE_URL}/rest/v1/slot_status?id=eq.1&select=data`, {
                  headers: {
                    apikey: process.env.SUPABASE_SERVICE_KEY,
                    Authorization: `Bearer ${process.env.SUPABASE_SERVICE_KEY}`,
                  },
                });
                const rows = await res.json();
                const items = rows && rows[0] && rows[0].data && rows[0].data.items;
                const allRedYellow = Array.isArray(items) && items.length > 0 && items.every(i => i && i.flag !== "green");
                if (allRedYellow) {
                  console.log("Saat 08:00 sonrası ve tüm bölgeler Uçulmaz -> otomatik kontrol durduruldu.");
                  fs.appendFileSync(out, "run=false\nsecond_pass=false\n");
                  return;
                }
              } catch (err) {
                console.warn("Supabase ön kontrolü okunamadı, taramaya devam ediliyor:", err.message);
              }
            }

            fs.appendFileSync(out, "run=true\nsecond_pass=true\n");
          })();
          EOF

      - name: slot-watch bağımlılıklarını kur
        if: steps.gate.outputs.run == 'true'
        working-directory: slot-watch
        run: npm ci || npm install

      - name: 1. Tur Slot kontrolü
        if: steps.gate.outputs.run == 'true'
        working-directory: slot-watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: node index.js

      - name: 2 dakika bekle ve 2. Tur Slot kontrolü yap
        if: steps.gate.outputs.run == 'true' && steps.gate.outputs.second_pass == 'true'
        working-directory: slot-watch
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          sleep 120
          node index.js
