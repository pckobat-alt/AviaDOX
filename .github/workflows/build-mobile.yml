name: AviaDoX Android (.apk) ve iOS (.ipa) Derleme

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-android-apk:
    name: Android APK Derle (Ubuntu + Gradle)
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Java 17 (Temurin) kur
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Bağımlılıkları kur ve çevrimdışı Supabase paketini hazırla
        run: |
          npm install
          npm run prepare:web

      - name: Android projesini oluştur ve senkronize et
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: AndroidManifest.xml arka plan GPX ve bildirim izinlerini uygula
        run: |
          node -e '
            const fs = require("fs");
            const p = "android/app/src/main/AndroidManifest.xml";
            let xml = fs.readFileSync(p, "utf8");
            const perms = [
              "android.permission.INTERNET",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_BACKGROUND_LOCATION",
              "android.permission.FOREGROUND_SERVICE",
              "android.permission.FOREGROUND_SERVICE_LOCATION",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.WAKE_LOCK"
            ];
            for (const perm of perms) {
              if (!xml.includes(perm)) {
                xml = xml.replace("<application", `    <uses-permission android:name="${perm}" />\n    <application`);
              }
            }
            if (!xml.includes("foregroundServiceType=\"location\"")) {
              const svc = `        <service android:name="com.equimaps.capacitor_background_geolocation.BackgroundGeolocationService" android:enabled="true" android:exported="false" android:foregroundServiceType="location" />\n`;
              xml = xml.replace("</application>", svc + "    </application>");
            }
            fs.writeFileSync(p, xml, "utf8");
            console.log("AndroidManifest.xml guncellendi.");
          '

      - name: Android Debug APK derle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Android APK dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: AviaDoX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios-ipa:
    name: iOS IPA Derle (macOS + Xcode)
    runs-on: macos-15
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları kur ve çevrimdışı Supabase paketini hazırla
        run: |
          npm install
          npm run prepare:web

      - name: iOS projesini oluştur, AppDelegate ve Info.plist uygula
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          if [ -f "ios-config/AppDelegate.swift" ]; then
            cp ios-config/AppDelegate.swift ios/App/App/AppDelegate.swift
          fi
          npx cap sync ios

          python3 - <<'PY'
          import plistlib
          plist_path = "ios/App/App/Info.plist"
          with open(plist_path, "rb") as f:
              data = plistlib.load(f)
          modes = list(data.get("UIBackgroundModes", []))
          for m in ("location", "remote-notification"):
              if m not in modes:
                  modes.append(m)
          data["UIBackgroundModes"] = modes
          data["NSSupportsLiveActivities"] = True
          data["NSLocationWhenInUseUsageDescription"] = (
              "AviaDoX, balon uçuşlarınızın GPX rotasını, irtifasını, hızını ve yönünü kaydetmek için konumunuzu kullanır."
          )
          data["NSLocationAlwaysAndWhenInUseUsageDescription"] = (
              "AviaDoX, ekran kilitliyken veya uygulama arka plandayken uçuş GPX konum kaydını kesintisiz sürdürmek ve kilit ekranı bildirimini güncellemek için arka plan konum iznine ihtiyaç duyar."
          )
          data["NSLocationAlwaysUsageDescription"] = (
              "AviaDoX, ekran kilitliyken uçuş GPX kaydını kesintisiz sürdürmek için arka plan konum iznine ihtiyaç duyar."
          )
          with open(plist_path, "wb") as f:
              plistlib.dump(data, f)
          print("Info.plist guncellendi.")
          PY

      - name: Xcode Archive ve unsigned .ipa paketle
        run: |
          mkdir -p build/Payload
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/AviaDoX.xcarchive \
            archive
          cp -r build/AviaDoX.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r AviaDoX-unsigned.ipa Payload

      - name: iOS IPA dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: AviaDoX-iOS-IPA
          path: build/AviaDoX-unsigned.ipa
