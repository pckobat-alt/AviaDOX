name: AviaDoX iOS (.ipa) Derleme

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'src/**'
      - 'ios/**'
      - 'ios-config/**'
      - 'package*.json'
      - 'capacitor.config.*'
      - '.github/workflows/build-ios.yml'

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-ipa:
    name: iOS IPA Derle
    runs-on: macos-latest
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js 20 kur ve npm önbelleğini kullan
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: CocoaPods önbelleğini yükle
        uses: actions/cache@v4
        with:
          path: |
            ios/App/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/package-lock.json', '**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Bağımlılıkları kur ve çevrimdışı Supabase paketini hazırla
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run prepare:web
          test -s www/vendor/supabase.umd.js

      - name: iOS projesini oluştur, AppDelegate ve Info.plist uygula
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          if [ -f "ios-config/AppDelegate.swift" ]; then
            cp ios-config/AppDelegate.swift ios/App/App/AppDelegate.swift
          fi
          npx cap sync ios

          python3 - <<'PY'
          import plistlib
          plist_path = "ios/App/App/Info.plist"
          with open(plist_path, "rb") as f:
              data = plistlib.load(f)
          modes = list(data.get("UIBackgroundModes", []))
          for m in ("location", "remote-notification"):
              if m not in modes:
                  modes.append(m)
          data["UIBackgroundModes"] = modes
          data["NSSupportsLiveActivities"] = True
          data["NSLocationWhenInUseUsageDescription"] = (
              "AviaDoX, balon uçuşlarınızın GPX rotasını, irtifasını, hızını ve yönünü kaydetmek için konumunuzu kullanır."
          )
          data["NSLocationAlwaysAndWhenInUseUsageDescription"] = (
              "AviaDoX, ekran kilitliyken veya uygulama arka plandayken uçuş GPX konum kaydını kesintisiz sürdürmek ve kilit ekranı bildirimini güncellemek için arka plan konum iznine ihtiyaç duyar."
          )
          data["NSLocationAlwaysUsageDescription"] = (
              "AviaDoX, ekran kilitliyken uçuş GPX kaydını kesintisiz sürdürmek için arka plan konum iznine ihtiyaç duyar."
          )
          with open(plist_path, "wb") as f:
              plistlib.dump(data, f)
          print("Info.plist guncellendi.")
          PY

      - name: www/splash.gif dosyasından iOS uygulama ikonunu (1024×1024) üret
        run: |
          if [ -f "www/splash.gif" ]; then
            swift - <<'SWIFT'
          import Foundation
          import CoreGraphics
          import ImageIO
          import UniformTypeIdentifiers

          let srcUrl = URL(fileURLWithPath: "www/splash.gif")
          guard let imgSrc = CGImageSourceCreateWithURL(srcUrl as CFURL, nil),
                let frame = CGImageSourceCreateImageAtIndex(imgSrc, 0, nil) else {
              fputs("Hata: www/splash.gif okunamadi.\n", stderr)
              exit(1)
          }

          let colorSpace = CGColorSpaceCreateDeviceRGB()
          var cornerPx: [UInt8] = [11, 25, 41, 255]
          if let cornerCrop = frame.cropping(to: CGRect(x: 0, y: 0, width: 1, height: 1)),
             let sampleCtx = CGContext(
              data: &cornerPx,
              width: 1,
              height: 1,
              bitsPerComponent: 8,
              bytesPerRow: 4,
              space: colorSpace,
              bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue
          ) {
              sampleCtx.draw(cornerCrop, in: CGRect(x: 0, y: 0, width: 1, height: 1))
          }
          let bgR = cornerPx[3] >= 128 ? CGFloat(cornerPx[0]) / 255.0 : 11.0 / 255.0
          let bgG = cornerPx[3] >= 128 ? CGFloat(cornerPx[1]) / 255.0 : 25.0 / 255.0
          let bgB = cornerPx[3] >= 128 ? CGFloat(cornerPx[2]) / 255.0 : 41.0 / 255.0

          let size = 1024
          guard let ctx = CGContext(
              data: nil,
              width: size,
              height: size,
              bitsPerComponent: 8,
              bytesPerRow: size * 4,
              space: colorSpace,
              bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue
          ) else {
              fputs("Hata: 1024x1024 ikon baglami olusturulamadi.\n", stderr)
              exit(1)
          }

          ctx.interpolationQuality = .high
          ctx.setFillColor(red: bgR, green: bgG, blue: bgB, alpha: 1.0)
          ctx.fill(CGRect(x: 0, y: 0, width: size, height: size))

          let fw = CGFloat(frame.width)
          let fh = CGFloat(frame.height)
          let target = CGFloat(size) * 0.88
          let scale = min(target / fw, target / fh)
          let dw = fw * scale
          let dh = fh * scale
          let rect = CGRect(
              x: (CGFloat(size) - dw) / 2.0,
              y: (CGFloat(size) - dh) / 2.0,
              width: dw,
              height: dh
          )
          ctx.draw(frame, in: rect)

          guard let outImg = ctx.makeImage() else {
              fputs("Hata: iOS ikon goruntusu uretilemedi.\n", stderr)
              exit(1)
          }

          let iconSetDir = URL(fileURLWithPath: "ios/App/App/Assets.xcassets/AppIcon.appiconset")
          let fm = FileManager.default
          try fm.createDirectory(at: iconSetDir, withIntermediateDirectories: true)
          if let existing = try? fm.contentsOfDirectory(at: iconSetDir, includingPropertiesForKeys: nil) {
              for item in existing where item.pathExtension.lowercased() == "png" {
                  try? fm.removeItem(at: item)
              }
          }

          let outPng = iconSetDir.appendingPathComponent("AppIcon-512@2x.png")
          guard let dest = CGImageDestinationCreateWithURL(outPng as CFURL, UTType.png.identifier as CFString, 1, nil) else {
              fputs("Hata: PNG hedefi acilamadi.\n", stderr)
              exit(1)
          }
          CGImageDestinationAddImage(dest, outImg, nil)
          guard CGImageDestinationFinalize(dest) else {
              fputs("Hata: PNG kaydedilemedi.\n", stderr)
              exit(1)
          }

          let contentsJson = """
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "Emre",
              "version" : 1.8
            }
          }
          """
          try contentsJson.write(to: iconSetDir.appendingPathComponent("Contents.json"), atomically: true, encoding: .utf8)
          print("iOS 1024x1024 opak uygulama ikonu www/splash.gif dosyasindan uretildi.")
          SWIFT
          fi

      - name: Xcode Archive ve unsigned .ipa paketle
        run: |
          mkdir -p build/Payload
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -archivePath build/AviaDoX.xcarchive \
            archive
          cp -r build/AviaDoX.xcarchive/Products/Applications/App.app build/Payload/
          cd build && zip -r AviaDoX-unsigned.ipa Payload

      - name: iOS IPA dosyasını artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: AviaDoX-iOS-IPA
          path: build/AviaDoX-unsigned.ipa
