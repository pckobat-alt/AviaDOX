name: Build AviaDoX iOS IPA

on:
  workflow_dispatch:
    inputs:
      signing_mode:
        description: "İmzalama modu (unsigned: AltStore/Sideloadly/Test, signed: App Store/Ad-Hoc)"
        required: true
        default: "unsigned"
        type: choice
        options:
          - unsigned
          - signed

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Capacitor bağımlılıklarını yükle ve iOS projesini oluştur
        run: |
          npm install
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi
          npx cap sync ios

      - name: Info.plist arka plan GPX izinlerini uygula
        run: |
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes:0 string location" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSLocationWhenInUseUsageDescription 'AviaDoX, Flight Log uçuş kaydını haritada göstermek ve GPX uçuş izini oluşturmak için konumunuzu kullanır.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSLocationWhenInUseUsageDescription string 'AviaDoX, Flight Log uçuş kaydını haritada göstermek ve GPX uçuş izini oluşturmak için konumunuzu kullanır.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysAndWhenInUseUsageDescription 'AviaDoX, sıcak hava balonu uçuşu sırasında ekran kapalıyken veya uygulama arka plandayken GPX konum kaydına kesintisiz devam etmek için arka plan konum izni gerektirir.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysAndWhenInUseUsageDescription string 'AviaDoX, sıcak hava balonu uçuşu sırasında ekran kapalıyken veya uygulama arka plandayken GPX konum kaydına kesintisiz devam etmek için arka plan konum izni gerektirir.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :NSLocationAlwaysUsageDescription 'AviaDoX, uçuş kaydı açıkken uygulama arka planda olsa bile GPX izini kaydetmeye devam eder.'" "$PLIST" || \
            /usr/libexec/PlistBuddy -c "Add :NSLocationAlwaysUsageDescription string 'AviaDoX, uçuş kaydı açıkken uygulama arka planda olsa bile GPX izini kaydetmeye devam eder.'" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSPhotoLibraryUsageDescription string 'Evrak ve profil fotoğrafı yüklemek için fotoğraf arşivi erişimi gerekir.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 'Evrak veya fotoğraf çekmek için kamera erişimi gerekir.'" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :UIFileSharingEnabled bool true" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :LSSupportsOpeningDocumentsInPlace bool true" "$PLIST" 2>/dev/null || true

      - name: CocoaPods yükle
        working-directory: ios/App
        run: pod install

      - name: İmzasız .ipa derle (AltStore / Sideloadly / lokal imzalama için)
        if: ${{ inputs.signing_mode == 'unsigned' }}
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr AviaDoX-unsigned.ipa Payload

      - name: AviaDoX.ipa dosyasını indirilebilir artifact olarak yükle
        uses: actions/upload-artifact@v4
        with:
          name: AviaDoX-iOS-IPA
          path: ios/App/AviaDoX-unsigned.ipa
